<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Resume - ResumeCraft</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        📄 ResumeCraft
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
    </div>

</nav>


<div class="form-page">

    <div class="form-heading">

        <span class="badge">
            ✨ Step 1 of 1
        </span>

        <h1>Create Your Resume</h1>

        <p>
            Fill in your details below and we'll create
            a professional resume for you.
        </p>

    </div>


    <form method="POST" action="/create"
          class="resume-form">


        <!-- PERSONAL INFORMATION -->

        <div class="form-section">

            <h2>👤 Personal Information</h2>

            <div class="form-grid">

                <div class="input-group">

                    <label>Full Name *</label>

                    <input type="text"
                           name="name"
                           placeholder="e.g. Isha Dhomne"
                           required>

                </div>


                <div class="input-group">

                    <label>Email *</label>

                    <input type="email"
                           name="email"
                           placeholder="example@gmail.com"
                           required>

                </div>


                <div class="input-group">

                    <label>Phone Number *</label>

                    <input type="text"
                           name="phone"
                           placeholder="+91 9876543210"
                           required>

                </div>


                <div class="input-group">

                    <label>Location</label>

                    <input type="text"
                           name="address"
                           placeholder="City, State">

                </div>

            </div>

        </div>


        <!-- CAREER OBJECTIVE -->

        <div class="form-section">

            <h2>🎯 Career Objective</h2>

            <textarea
                name="career"
                placeholder="Write a short professional career objective..."
                rows="5"></textarea>

        </div>


        <!-- EDUCATION -->

        <div class="form-section">

            <h2>🎓 Education</h2>

            <textarea
                name="education"
                placeholder="BCA - XYZ College - 2024-2027&#10;12th - ABC School - 2024"
                rows="5"></textarea>

        </div>


        <!-- SKILLS -->

        <div class="form-section">

            <h2>💻 Skills</h2>

            <input
                type="text"
                name="skills"
                placeholder="Python, Java, HTML, CSS, SQL">

            <p class="hint">
                Separate multiple skills using commas.
            </p>

        </div>


        <!-- PROJECTS -->

        <div class="form-section">

            <h2>🚀 Projects</h2>

            <textarea
                name="projects"
                placeholder="Project Name - Online Resume Builder&#10;Technologies: Python, Flask, HTML, CSS"
                rows="5"></textarea>

        </div>


        <!-- EXPERIENCE -->

        <div class="form-section">

            <h2>💼 Experience</h2>

            <textarea
                name="experience"
                placeholder="Fresher / Internship / Work experience..."
                rows="5"></textarea>

        </div>


        <!-- CERTIFICATES -->

        <div class="form-section">

            <h2>🏆 Certificates</h2>

            <textarea
                name="certificates"
                placeholder="Python Programming Certificate&#10;Web Development Certificate"
                rows="5"></textarea>

        </div>


        <button type="submit"
                class="generate-btn">

            Generate My Resume →
            
        </button>


    </form>

</div>

</body>

</html>
